<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="radial-glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-glow2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        0% { stop-color: #6366f1; }
        33% { stop-color: #ec4899; }
        66% { stop-color: #06b6d4; }
        100% { stop-color: #6366f1; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatOpposite 8.5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 12, 16;
        animation: dashFlow 15s linear infinite;
      }
      .pulse-circle {
        animation: pulseGlow 4s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .orbit-group {
        animation: orbitRotate 30s linear infinite;
        transform-origin: 980px 180px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="140" r="260" fill="url(#radial-glow1)" class="pulse-circle" />
  <circle cx="950" cy="240" r="240" fill="url(#radial-glow2)" class="pulse-circle" style="animation-delay: -2s;" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="420" />
    <line x1="180" y1="0" x2="180" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="420" y1="0" x2="420" y2="420" />
    <line x1="540" y1="0" x2="540" y2="420" />
    <line x1="660" y1="0" x2="660" y2="420" />
    <line x1="780" y1="0" x2="780" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1020" y1="0" x2="1020" y2="420" />
    <line x1="1140" y1="0" x2="1140" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Flowing Dynamic Data Streams (Behind text) -->
  <g fill="none" stroke-width="2">
    <path class="flow-line" stroke="#6366f1" opacity="0.45" d="M -40,120 Q 350,-20 620,180 T 1240,150" />
    <path class="flow-line" stroke="#06b6d4" opacity="0.35" style="animation-delay: -5s;" d="M -40,290 Q 280,390 700,240 T 1240,300" />
    <path class="flow-line" stroke="#a855f7" opacity="0.3" style="animation-delay: -10s;" d="M 100,430 Q 550,220 900,380 T 1260,80" />
  </g>

  <!-- Animated Decorative Background Node Cluster (Right Side) -->
  <g class="orbit-group" opacity="0.6">
    <!-- Orbital Rings -->
    <circle cx="980" cy="180" r="110" fill="none" stroke="#4f46e5" stroke-dasharray="4,8" stroke-width="1.5" />
    <circle cx="980" cy="180" r="65" fill="none" stroke="#06b6d4" stroke-dasharray="6,6" stroke-width="1" />
    
    <!-- Planetary Satellite Nodes -->
    <circle cx="980" cy="70" r="9" fill="#38bdf8" filter="url(#glow-blur)" />
    <circle cx="1080" cy="180" r="7" fill="#a855f7" filter="url(#glow-blur)" />
    <circle cx="915" cy="235" r="8" fill="#ec4899" filter="url(#glow-blur)" />
    <circle cx="980" cy="115" r="5" fill="#10b981" />
  </g>

  <!-- Dynamic Floating Decorative Badges / Pills (Soft Background Layer) -->
  <g class="floating-card-1" opacity="0.75">
    <!-- Mini badge: AI Agents -->
    <g transform="translate(860, 50)">
      <rect width="130" height="34" rx="17" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#6366f1" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ AI Agents</text>
    </g>
    <!-- Mini badge: Remote Work -->
    <g transform="translate(970, 310)">
      <rect width="150" height="34" rx="17" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#06b6d4" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Remote Work</text>
    </g>
  </g>

  <g class="floating-card-2" opacity="0.75">
    <!-- Mini badge: Talent Matching -->
    <g transform="translate(730, 335)">
      <rect width="165" height="34" rx="17" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#a855f7" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🤝 Talent Matching</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed 100% Crisp & Visible) -->
  <g id="foreground-content" transform="translate(80, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 85)">
      <rect width="215" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="19" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">✦ CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Awesome <tspan fill="url(#primary-glow)">Virtual Assistant</tspan>
    </text>
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Marketplace
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Top SaaS Talent Platforms • Autonomous AI Workforces • Remote Infrastructure
    </text>

    <!-- Highlighted Feature Metrics / Tags -->
    <g transform="translate(0, 315)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">✓</text>
        <text x="32" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SaaS Marketplaces</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(162, 0)">
        <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#a855f7" font-family="monospace" font-size="13" font-weight="700">★</text>
        <text x="32" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source Agents</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(329, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">⚡</text>
        <text x="32" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">100% Free &amp; Open</text>
      </g>
    </g>

  </g>

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.35" />
</svg>
